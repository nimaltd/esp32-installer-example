# Read by esp32-installer. See https://github.com/nimaltd/esp32-installer
#
# A library made to try the installer on, and a starting point for your own:
# copy this file to the root of your library's repository, and change what is
# yours. Only name and files are required. The keys this library has no use
# for are here too, commented out, so every one is in one place.
#
# There is no version here. The installer reads it from the @version tag in
# the first header listed, so the source files are the only place it is written.

name: example                      # the library's name, its component and its folder
description: A period that never blocks, made to try esp32-installer on
repository: https://github.com/nimaltd/esp32-installer-example
license: Apache-2.0                # the licence's SPDX name

kind: utility                      # driver, middleware, rtos, protocol, filesystem,
                                   # utility or bsp
category: timing                   # sensor, storage, display, communication, wireless,
                                   # rtos, timing, power, input, math or system
provides: []                       # what it gives other libraries: [rtos] for an RTOS

requires:
  esp32_installer: 2.0.0           # the oldest esp32-installer that reads this file;
                                   # 2.0.0 for once, run and the cmake groups below
  libraries: []                    # other libraries, installed first when missing:
                                   #   - osal >= 1.0.0       no owner means nimaltd
                                   #   - owner/lib           anyone else's
                                   #   - owner/lib@v1.2.0    a tag, branch or commit
                                   #   - source: owner/other@v2.0.0
                                   #     manifest: manifests/other.yml
                                   #                         for a repository with no
                                   #                         installer.yml of its own
  kconfig: []                      # symbols it needs, set in sdkconfig.defaults:
                                   #   - FREERTOS_HZ=1000   SYMBOL=value, or a symbol
                                   #                        alone for =y
  peripherals: []                  # hardware it uses, named to the user, such as:
                                   #   - type: i2c
                                   #     note: 400 kHz

install:
  layout: mirror                   # mirror keeps the repository's folders, here src/,
                                   # flat puts every file at the top
  # include_dirs: [src]            # include folders, only when the guess is wrong
  # defines:                       # given to the library and every component using it
  #   - EXAMPLE_FAST               # NAME, or NAME=value

files:
  headers:                         # .h files; the first is the one to #include
    - src/example.h
  sources:                         # .c files, the component's SRCS
    - src/example.c

options:                           # parts the user chooses at install
  uptime:                          # the name typed after --with and --without
    description: Uptime in hours, minutes and seconds   # the question asked
    libraries: []                  # libraries this part needs, installed first
    files:
      headers:
        - src/example_uptime.h
      sources:
        - src/example_uptime.c

extras:                            # copied as they are, never compiled
  - LICENSE.md
  - NOTICE
  - README.md

once:                              # the project's own files, made when missing and
                                   # the user's from then on: never replaced or removed
  - from: project/example.defaults # its settings, added to the build by the defaults
                                   # group below; to: its place, when not its own name

run:                               # steps run once the files are in, each asked first
  - label: make-id                 # the name typed after --run and --no-run
    description: Make this device's own ID, example_id.h   # shown with the question
    script: scripts/make_id.py     # Python, run with the installer's own Python,
                                   # or command: [program, arguments], with no shell
    args: [example_id.h]           # given to the script, in the project's folder
    unless: example_id.h           # skipped when this file is there already

esp32:                             # read by esp32-installer only
  requires:                        # ESP-IDF components the code uses: its REQUIRES
    - esp_timer
  cmake:                           # groups of CMake lines, each in a place of its own
    - label: id                    # names the group, between markers of its own
      where: component             # the component's CMakeLists.txt, after its register
      lines:                       # the project's folder, where example_id.h is made
        - idf_build_get_property(example_project PROJECT_DIR)
        - target_include_directories(${COMPONENT_LIB} PRIVATE "${example_project}")
    - label: defaults              # ESP-IDF reads sdkconfig.defaults only while
      where: before-project        # SDKCONFIG_DEFAULTS is unset, so it is named first
      lines:
        - if(NOT SDKCONFIG_DEFAULTS AND EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/sdkconfig.defaults")
        - '    set(SDKCONFIG_DEFAULTS "${CMAKE_CURRENT_SOURCE_DIR}/sdkconfig.defaults")'
        - endif()
        - list(APPEND SDKCONFIG_DEFAULTS "${CMAKE_CURRENT_SOURCE_DIR}/example.defaults")
    # - label: report
    #   where: after-project       # the project's CMakeLists.txt, at its end
    #   lines:
    #     - 'message(STATUS "example is in")'
  settings:                        # Kconfig symbols for menuconfig, CONFIG_<name> in the code
    - name: EXAMPLE_PERIOD_MS      # the symbol, started with the library's name
      type: int                    # bool, int, hex or string
      default: 500                 # required: true or false, a number, 0x.. or text
      range: [1, 86400000]         # int and hex only: [smallest, largest]
      prompt: Milliseconds between two times example_due() says yes
      help: |
        A loop that calls example_due() gets a yes once every this many
        milliseconds, and never waits for it.
    - name: EXAMPLE_GREETING
      type: string
      default: Hello from example
      prompt: What example_hello() prints
